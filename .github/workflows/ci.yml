name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported (requires-python) and the primary development version.
        python-version: ["3.9", "3.11"]
    name: test (python ${{ matrix.python-version }})
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run checks
        if: matrix.python-version == '3.11'
        run: make check

      - name: Run tests
        run: make test

  # Branch protection requires a check named "test"; matrix jobs report under
  # per-version names, so this job aggregates them into that single check.
  test:
    if: always()
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix jobs to pass
        run: test "${{ needs.test-matrix.result }}" = "success"
